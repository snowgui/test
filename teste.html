<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Componentes Estilo Itaú</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --itau-orange: #FF6600;
      --itau-blue: #002663;
      --itau-gray: #f4f4f4;
    }

    .btn-orange {
      background-color: var(--itau-orange);
      color: #fff;
    }

    .btn-orange:hover {
      background-color: #e65c00;
    }

    .btn-blue {
      background-color: var(--itau-blue);
      color: #fff;
    }

    .btn-blue:hover {
      background-color: #001f4d;
    }

    .banner-itau {
      background-color: var(--itau-blue);
      color: white;
      padding: 2rem;
      border-radius: 1rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    .table-itau th {
      background-color: var(--itau-blue);
      color: white;
    }

    .table-itau td {
      background-color: var(--itau-gray);
    }

    .form-control:focus {
      border-color: var(--itau-orange);
      box-shadow: 0 0 0 0.2rem rgba(255, 102, 0, 0.25);
    }

    .title-itau {
      color: var(--itau-blue);
      font-weight: bold;
    }

    .subtitle-itau {
      color: var(--itau-orange);
    }

    .card-itau {
      border-left: 6px solid var(--itau-orange);
      padding: 1rem;
      background-color: #fff;
      margin-bottom: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body class="container py-5">

  <div class="banner-itau">
    <h1 class="title-itau">Bem-vindo ao Portal</h1>
    <p class="subtitle-itau">Soluções digitais com a cara do Itaú</p>
  </div>

  <h2 class="title-itau">Ações rápidas</h2>
  <button class="btn btn-orange me-2">Confirmar</button>
  <button class="btn btn-blue">Cancelar</button>

  <h2 class="mt-5 title-itau">Formulário</h2>
  <div class="mb-3">
    <label for="nome" class="form-label">Nome</label>
    <input type="text" class="form-control" id="nome" placeholder="Digite seu nome">
  </div>
  <div class="mb-3">
    <label for="mensagem" class="form-label">Mensagem</label>
    <textarea class="form-control" id="mensagem" rows="3"></textarea>
  </div>

  <h2 class="mt-5 title-itau">Tabela de Dados</h2>
  <table class="table table-itau">
    <thead>
      <tr>
        <th>#</th>
        <th>Nome</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>João</td>
        <td>Ativo</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Maria</td>
        <td>Inativo</td>
      </tr>
    </tbody>
  </table>

  <h2 class="mt-5 title-itau">Informações</h2>
  <div class="card-itau">
    <h5 class="title-itau">Atualização de Taxas</h5>
    <p>Verifique se as propostas estão com a taxa de juros correta antes de confirmar o envio.</p>
  </div>

</body>
</html>
